<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFlow – BOYWO</title>
    <meta name="description" content="Écoutez de la musique libre (Jamendo, Audius), des radios en direct et des vidéos YouTube officielles dans un seul lecteur.">
    <link rel="icon" href="../assets/icons/icon-128.png">
    <meta name="theme-color" content="#1abc9c">
    <script src="../assets/js/embed.js"></script>
    <script src="../assets/js/chrome-shim.js"></script>
    <link rel="stylesheet" href="../assets/css/site.css">
    <link rel="stylesheet" href="../assets/css/musicflow.css">
    <link rel="stylesheet" href="../assets/css/tools.css">
</head>
<body class="mf-body">
<a class="skip" href="#contenu">Aller au contenu</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../index.html"><img src="../assets/icons/icon-128.png" width="38" height="38" alt="">BOYWO</a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="../index.html#fonctionnalites">Fonctionnalités</a>
      <a href="index.html" aria-current="page">Outils en ligne</a>
      <a href="../index.html#installer">Installer</a>
      <a href="../privacy-policy.html">Confidentialité</a>
    </nav>
  </div>
</header>
<p class="tool-back"><a href="index.html">← Tous les outils</a></p>
<svg style="display:none" aria-hidden="true">
    <symbol id="m-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="m-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="m-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></symbol>
    <symbol id="m-prev" viewBox="0 0 24 24"><polygon points="19 4 9 12 19 20 19 4" fill="currentColor" stroke="none"/><line x1="5" y1="5" x2="5" y2="19"/></symbol>
    <symbol id="m-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
    <symbol id="m-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="m-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="m-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="m-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
    <symbol id="m-repeat" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="m-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
    <symbol id="m-back" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
    <symbol id="m-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
</svg>

<header class="mf-header">
    <div class="mf-brand">
        <img class="mf-logo" src="../assets/icons/icon-128.png" alt="Logo BOYWO" width="36" height="36">
        <div><h1 class="mf-title">MusicFlow</h1><span class="mf-sub">par BOYWO</span></div>
    </div>
    <form class="mf-search" id="mf-search-form" role="search">
        <svg class="mf-ico" aria-hidden="true"><use href="#m-search"></use></svg>
        <input type="search" id="mf-search-input" placeholder="Titres, artistes, albums…" aria-label="Rechercher" autocomplete="off">
    </form>
</header>

<div class="mf-layout">
    <nav class="mf-nav" aria-label="Sections">
        <button type="button" class="mf-nav-btn" data-tab="discover" aria-pressed="true">Découvrir</button>
        <button type="button" class="mf-nav-btn" data-tab="radio" aria-pressed="false">Radios</button>
        <button type="button" class="mf-nav-btn" data-tab="local" aria-pressed="false">Mes fichiers</button>
        <button type="button" class="mf-nav-btn" data-tab="favorites" aria-pressed="false">Favoris</button>
        <button type="button" class="mf-nav-btn" data-tab="playlists" aria-pressed="false">Playlists</button>
        <button type="button" class="mf-nav-btn" data-tab="settings" aria-pressed="false">Réglages</button>
    </nav>
    <div class="mf-content" id="contenu">
        <section class="mf-video" id="mf-video" aria-label="Lecteur vidéo YouTube" hidden>
            <div class="mfy-frame"><iframe id="mfy-frame" title="Lecteur YouTube officiel" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
            <div class="mf-video-head"><h2 id="mf-video-title">Vidéo</h2>
                <div class="mf-video-actions"><a class="mf-btn" id="mfy-open" href="#" target="_blank" rel="noopener noreferrer">Ouvrir sur YouTube</a><button type="button" class="mf-btn" id="mf-video-close">Fermer</button></div></div>
            <p class="mf-video-channel" id="mf-video-channel"></p>
        </section>
        <main class="mf-main" id="mf-main" aria-live="polite"></main>
    </div>
</div>

<footer class="mf-player" aria-label="Lecteur">
    <div class="mf-np">
        <img id="mf-np-cover" alt="" class="mf-np-cover">
        <div class="mf-np-text"><strong id="mf-np-title">Aucune lecture</strong><span id="mf-np-artist">—</span></div>
    </div>
    <div class="mf-ctrl">
        <div class="mf-btnrow">
            <button type="button" class="mf-icobtn" id="mf-shuffle" title="Aléatoire" aria-pressed="false"><svg class="mf-ico"><use href="#m-shuffle"></use></svg></button>
            <button type="button" class="mf-icobtn" id="mf-prev" title="Précédent"><svg class="mf-ico"><use href="#m-prev"></use></svg></button>
            <button type="button" class="mf-icobtn mf-big" id="mf-play" title="Lecture / Pause"><svg class="mf-ico"><use id="mf-play-use" href="#m-play"></use></svg></button>
            <button type="button" class="mf-icobtn" id="mf-next" title="Suivant"><svg class="mf-ico"><use href="#m-next"></use></svg></button>
            <button type="button" class="mf-icobtn" id="mf-repeat" title="Répéter" aria-pressed="false"><svg class="mf-ico"><use href="#m-repeat"></use></svg><small id="mf-repeat-one" hidden>1</small></button>
        </div>
        <div class="mf-prog"><span id="mf-time-cur">0:00</span><input type="range" id="mf-seek" min="0" max="100" step="0.1" value="0" aria-label="Position"><span id="mf-time-dur">0:00</span></div>
    </div>
    <div class="mf-vol"><svg class="mf-ico"><use href="#m-volume"></use></svg><input type="range" id="mf-volume" min="0" max="100" value="100" aria-label="Volume"></div>
</footer>

<dialog class="mf-dialog" id="mf-pl-dialog" aria-labelledby="mf-pl-title">
    <h2 id="mf-pl-title">Ajouter à une playlist</h2>
    <div id="mf-pl-list" class="mf-pl-list"></div>
    <form id="mf-pl-new" class="mf-pl-new"><input type="text" id="mf-pl-name" placeholder="Nouvelle playlist…" maxlength="60" aria-label="Nom de la nouvelle playlist"><button type="submit" class="mf-btn mf-btn-solid">Créer</button></form>
    <div class="mf-dialog-actions"><button type="button" class="mf-btn" id="mf-pl-close">Fermer</button></div>
</dialog>

<input type="file" id="mf-file-input" multiple accept="audio/*" hidden>
<input type="file" id="mf-folder-input" webkitdirectory multiple hidden>
<div class="mf-toast" id="mf-toast" role="status" aria-live="polite"></div>

<!-- audio-db.js = bibliothèque locale BOYWO (IndexedDB), réutilisée telle quelle. mf-engine.js = moteur audio de l'extension, ici dans la page. -->
<script src="../assets/js/audio-db.js"></script>
<script src="../assets/js/musicflow/mf-config.js"></script>
<script src="../assets/js/musicflow/mf-store.js"></script>
<script src="../assets/js/musicflow/mf-providers.js"></script>
<script src="../assets/js/musicflow/mf-ytplayer.js"></script>
<script src="../assets/js/musicflow/mf-engine.js"></script>
<script src="../assets/js/musicflow/mf-site.js"></script>
</body>
</html>
